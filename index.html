// ── TOAST ───────────────────────────────────────────────────────
let _T=null;
function ToastHost(){
  const[list,setList]=useState([]);
  useEffect(()=>{_T=(msg,type="success")=>{const id=Date.now();setList(p=>[...p,{id,msg,type}]);setTimeout(()=>setList(p=>p.filter(t=>t.id!==id)),3000);};},[]);
  return(
    <div className="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none">
      {list.map(t=>(
        <div key={t.id} className={`slide-in px-4 py-3 rounded-xl shadow-2xl text-sm font-medium flex items-center gap-2 pointer-events-auto
          ${t.type==="success"?"bg-emerald-500 text-white":t.type==="error"?"bg-red-500 text-white":"bg-blue-500 text-white"}`}>
          {t.type==="success"?"✓":t.type==="error"?"✕":"🔔"} {t.msg}
        </div>
      ))}
    </div>
  );
}
const toast=(msg,type)=>_T&&_T(msg,type);

function ClassroomPage({rooms,setRooms,students,setStudents,dk}){
  const[showAdd,setShowAdd]=useState(false);
  const[editRoom,setEditRoom]=useState(null);   // room object being edited
  const[deleteRoom,setDeleteRoom]=useState(null); // room object to confirm delete
  const[sel,setSel]=useState(null);             // room selected to view students
  const[q,setQ]=useState("");

  const addRoom=(form)=>{
    setRooms(p=>[...p,{id:Date.now(),name:form.name,subject:form.subject,students:0,color:form.color}]);
    setShowAdd(false);toast("เพิ่มห้องเรียนสำเร็จ ✓","success");
  };

  const saveEdit=(form)=>{
    setRooms(p=>p.map(r=>r.id===editRoom.id?{...r,name:form.name,subject:form.subject,color:form.color}:r));
    // sync sel if currently viewing
    if(sel&&sel.id===editRoom.id) setSel(prev=>({...prev,name:form.name,subject:form.subject,color:form.color}));
    setEditRoom(null);toast("แก้ไขข้อมูลห้องเรียนแล้ว ✓","success");
  };

  const confirmDelete=()=>{
    setRooms(p=>p.filter(r=>r.id!==deleteRoom.id));
    setStudents(prev=>{const n={...prev};delete n[deleteRoom.id];return n;});
    if(sel&&sel.id===deleteRoom.id) setSel(null);
    toast(`ลบห้อง ${deleteRoom.name} แล้ว`,"error");
    setDeleteRoom(null);
  };

  // ── Student detail view ──
  if(sel){
    const currentRoom=rooms.find(r=>r.id===sel.id)||sel;
    const st=(students[sel.id]||[]).filter(s=>q===""||s.name.includes(q)||String(s.no).includes(q));
    return(<div className="p-4 space-y-4 pb-24 lg:pb-6">
      {deleteRoom&&<DeleteConfirm room={deleteRoom} onConfirm={confirmDelete} onCancel={()=>setDeleteRoom(null)} dk={dk}/>}
      <div className="flex items-center gap-3">
        <button onClick={()=>{setSel(null);setQ("");}} className={`w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 ${dk?"bg-slate-800 text-slate-400":"bg-gray-100 text-gray-600"}`}><Ic n="arr" s={18} c="rotate-180"/></button>
        <div className="flex-1 min-w-0">
          <div className={`font-bold truncate ${dk?"text-white":"text-gray-900"}`}>{currentRoom.name}</div>
          <div className={`text-xs ${dk?"text-slate-400":"text-gray-500"}`}>{currentRoom.subject} · {currentRoom.students} คน</div>
        </div>
        {/* edit & delete buttons in student view */}
        <button onClick={()=>setEditRoom(currentRoom)} className={`w-9 h-9 rounded-xl flex items-center justify-center ${dk?"bg-slate-800 text-slate-400 hover:text-cyan-400":"bg-gray-100 text-gray-500 hover:text-cyan-600"}`}><Ic n="edit" s={16}/></button>
        <button onClick={()=>setDeleteRoom(currentRoom)} className={`w-9 h-9 rounded-xl flex items-center justify-center ${dk?"bg-slate-800 text-slate-400 hover:text-red-400":"bg-gray-100 text-gray-500 hover:text-red-500"}`}><Ic n="trash" s={16}/></button>
      </div>

      {editRoom&&<RoomForm initial={{name:editRoom.name,subject:editRoom.subject,color:editRoom.color}} onSave={saveEdit} onCancel={()=>setEditRoom(null)} dk={dk}/>}

      <div className={`flex items-center gap-2 px-3 py-2.5 rounded-xl border ${dk?"bg-slate-800 border-slate-700":"bg-gray-50 border-gray-200"}`}>
        <Ic n="search" s={16} c={dk?"text-slate-500":"text-gray-400"}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหานักเรียน..." className={`flex-1 bg-transparent text-sm outline-none ${dk?"text-white placeholder-slate-500":"text-gray-900 placeholder-gray-400"}`}/>
      </div>
      <div className="space-y-2">
        {st.length===0&&<div className={`text-center py-10 text-sm ${dk?"text-slate-500":"text-gray-400"}`}>ไม่พบนักเรียน</div>}
        {st.map(s=>(<div key={s.id} className={`flex items-center gap-3 p-3 rounded-xl border ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
          <div className="w-9 h-9 rounded-full bg-gradient-to-br from-cyan-400 to-teal-500 flex items-center justify-center text-white text-xs font-bold">{s.no}</div>
          <div className="flex-1 min-w-0"><div className={`text-sm font-medium truncate ${dk?"text-white":"text-gray-900"}`}>{s.name}</div><div className={`text-xs ${dk?"text-slate-500":"text-gray-400"}`}>เลขที่ {s.no}</div></div>
          <span className={`text-xs px-2 py-1 rounded-lg border font-medium ${sCls(s.status,dk)}`}>{sLabel(s.status)}</span>
        </div>))}
      </div>
    </div>);
  }

  // ── Room list view ──
  return(<div className="p-4 space-y-4 pb-24 lg:pb-6">
    {deleteRoom&&<DeleteConfirm room={deleteRoom} onConfirm={confirmDelete} onCancel={()=>setDeleteRoom(null)} dk={dk}/>}

      <p className={`text-sm ${dk?"text-slate-400":"text-gray-500"}`}>{rooms.length} ห้องเรียน</p>
      <button onClick={()=>{setShowAdd(true);setEditRoom(null);}} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-cyan-500 text-white text-sm font-medium shadow-lg shadow-cyan-500/30 active:scale-95"><Ic n="plus" s={16}/> เพิ่มห้อง</button>
    </div>

    {showAdd&&!editRoom&&<RoomForm onSave={addRoom} onCancel={()=>setShowAdd(false)} dk={dk}/>}

    <div className="space-y-3">
      {rooms.map(r=>{
        const st=students[r.id]||[];
        const rt=st.length?Math.round((st.filter(s=>s.status!=="not_submitted").length/st.length)*100):0;
        const isEditing=editRoom?.id===r.id&&!showAdd;
        return(<div key={r.id}>
          {/* Edit form inline */}
          {isEditing&&<RoomForm initial={{name:r.name,subject:r.subject,color:r.color}} onSave={saveEdit} onCancel={()=>setEditRoom(null)} dk={dk}/>}

            <div className="flex items-center gap-3 mb-3">

              <div onClick={()=>setSel(r)} className="w-12 h-12 rounded-2xl flex items-center justify-center text-white font-bold text-xs cursor-pointer flex-shrink-0" style={{background:r.color}}>{r.name}</div>
              <div className="flex-1 min-w-0 cursor-pointer" onClick={()=>setSel(r)}>
                <div className={`font-semibold truncate ${dk?"text-white":"text-gray-900"}`}>{r.subject}</div>
                <div className={`text-xs mt-0.5 ${dk?"text-slate-400":"text-gray-500"}`}>{r.students} คน</div>
              </div>
              {/* action buttons */}
              <div className="flex items-center gap-1.5 flex-shrink-0">
                <div className="text-right mr-2">
                  <div className={`text-base font-bold ${rt>=80?"text-emerald-500":rt>=60?"text-amber-500":"text-red-500"}`}>{rt}%</div>
                  <div className={`text-[10px] ${dk?"text-slate-500":"text-gray-400"}`}>ส่งงาน</div>
                </div>
                <button onClick={e=>{e.stopPropagation();setEditRoom(r);setShowAdd(false);}}
                  className={`w-8 h-8 rounded-xl flex items-center justify-center transition-all ${dk?"bg-slate-700 text-slate-400 hover:text-cyan-400":"bg-gray-100 text-gray-400 hover:text-cyan-600"}`}>
                  <Ic n="edit" s={15}/>
                </button>
                <button onClick={e=>{e.stopPropagation();setDeleteRoom(r);}}
                  className={`w-8 h-8 rounded-xl flex items-center justify-center transition-all ${dk?"bg-slate-700 text-slate-400 hover:text-red-400":"bg-gray-100 text-gray-400 hover:text-red-500"}`}>

            <div className={`h-2 rounded-full ${dk?"bg-slate-700":"bg-gray-100"} overflow-hidden`}>

                <div key={i.l} className="flex items-center gap-1"><div className="w-2 h-2 rounded-full" style={{background:i.c}}/><span className={`text-xs ${dk?"text-slate-400":"text-gray-500"}`}>{i.l} {i.v}</span></div>
              ))}
            </div>
          </div>
        </div>);
      })}
      {rooms.length===0&&(
        <div className={`text-center py-16 ${dk?"text-slate-500":"text-gray-400"}`}>
          <div className="text-5xl mb-3 opacity-30">🏫</div>
          <p className="text-sm">ยังไม่มีห้องเรียน กด "เพิ่มห้อง" เพื่อเริ่มต้น</p>
        </div>
      )}
    </div>
  </div>);
}

  useEffect(()=>{if(fabTrigger>0){if(room){setStep(2);setShowAdd(true);}else toast("เลือกห้องเรียนก่อน แล้วกด + เพิ่มงาน","info");}},[fabTrigger]);

  const roomAsgns=asgns.filter(a=>a.classroomId===room?.id);

      <div className="flex gap-2">

        <input type="date" value={form.dueDate} onChange={e=>setForm(p=>({...p,dueDate:e.target.value}))} className={`flex-1 px-3 py-2.5 rounded-xl border text-sm outline-none ${dk?"bg-slate-700 border-slate-600 text-white":"bg-white border-gray-200"}`}/>

    </div>)}

      </div>

  </div>);

  const allSt=students[room.id]||[];
  const summ={submitted:allSt.filter(s=>s.status==="submitted").length,late:allSt.filter(s=>s.status==="late").length,not_submitted:allSt.filter(s=>s.status==="not_submitted").length};
  return(<div className="pb-24 lg:pb-6">
    <div className={`sticky top-[57px] z-30 p-4 border-b ${dk?"bg-slate-900 border-slate-800":"bg-gray-50 border-gray-100"}`}>

        <button onClick={()=>setStep(2)} className={`w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 ${dk?"bg-slate-800 text-slate-400":"bg-white text-gray-600"} border ${dk?"border-slate-700":"border-gray-200"}`}><Ic n="arr" s={18} c="rotate-180"/></button>
        <div className="flex-1 min-w-0"><div className={`font-bold text-sm truncate ${dk?"text-white":"text-gray-900"}`}>{asgn.title}</div><div className={`text-xs ${dk?"text-slate-400":"text-gray-500"}`}>{room.name} · เต็ม {asgn.maxScore}</div></div>

      </div>
      <div className="flex gap-2 overflow-x-auto pb-1">
        {[{label:"ส่งทุกคน",fn:()=>bulkSet("submitted"),col:"emerald"},{label:"ไม่ส่งทั้งหมด",fn:()=>bulkSet("not_submitted"),col:"red"},{label:"คะแนนเต็ม",fn:autoScore,col:"cyan"}].map(b=>(
          <button key={b.label} onClick={b.fn} className={`flex-shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium active:scale-95 border ${b.col==="emerald"?"bg-emerald-500/10 text-emerald-500 border-emerald-500/30":b.col==="red"?"bg-red-500/10 text-red-500 border-red-500/30":"bg-cyan-500/10 text-cyan-500 border-cyan-500/30"}`}>{b.label}</button>
        ))}
      </div>
    </div>
    <div className="p-4 space-y-2">
      {studs.map(s=>(<div key={s.id} className={`rounded-2xl p-3 border ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-full bg-gradient-to-br from-cyan-400 to-teal-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">{s.no}</div>
          <div className="flex-1 min-w-0"><div className={`text-sm font-medium truncate ${dk?"text-white":"text-gray-900"}`}>{s.name}</div></div>
          <select value={s.status} onChange={e=>upd(s.id,"status",e.target.value)} className={`text-xs px-2 py-1.5 rounded-xl border outline-none cursor-pointer ${sCls(s.status,dk)}`} style={{background:"transparent"}}>
            <option value="submitted">ส่งแล้ว</option><option value="late">ส่งช้า</option><option value="not_submitted">ไม่ส่ง</option><option value="pending">รอตรวจ</option>
          </select>
          <input type="number" value={s.score} min={0} max={asgn.maxScore} onChange={e=>upd(s.id,"score",Math.max(0,Math.min(parseInt(e.target.value)||0,asgn.maxScore)))} className={`w-14 text-center text-sm font-bold px-2 py-1.5 rounded-xl border outline-none ${dk?"bg-slate-700 border-slate-600 text-white":"bg-gray-50 border-gray-200 text-gray-900"}`}/>
        </div>
        <div className="mt-2 ml-12"><input value={s.note} onChange={e=>upd(s.id,"note",e.target.value)} placeholder="หมายเหตุ..." className={`w-full text-xs px-2 py-1.5 rounded-lg border outline-none ${dk?"bg-slate-700/50 border-slate-700 text-slate-300 placeholder-slate-600":"bg-gray-50 border-gray-100 text-gray-600"}`}/></div>
      </div>))}
    </div>
  </div>);
}

// ── REPORTS ─────────────────────────────────────────────────────
function ReportsPage({rooms,students,asgns,dk}){
  const[activeRoom,setActiveRoom]=useState(rooms[0]?.id);
  const[viewMode,setViewMode]=useState("overview");
  const[selStu,setSelStu]=useState(null);
  const[q,setQ]=useState("");
  const roomSt=students[activeRoom]||[];
  const roomAsgns=asgns.filter(a=>a.classroomId===activeRoom);
  const sub=roomSt.filter(s=>s.status==="submitted").length;
  const late=roomSt.filter(s=>s.status==="late").length;
  const notS=roomSt.filter(s=>s.status==="not_submitted").length;
  const total=roomSt.length;
  const stuMatrix=roomSt.map(s=>{
    const records=roomAsgns.map((a,idx)=>{
      const hash=(s.id*13+a.id*7+idx)%10;
      const status=s.status==="not_submitted"&&idx===0?"not_submitted":hash<6?"submitted":hash<8?"late":"not_submitted";
      return{assignmentId:a.id,title:a.title,status};
    });
    return{...s,records,submitCount:records.filter(r=>r.status==="submitted").length,lateCount:records.filter(r=>r.status==="late").length,notCount:records.filter(r=>r.status==="not_submitted").length};
  });
  const filteredStu=stuMatrix.filter(s=>q===""||s.name.includes(q)||String(s.no).includes(q));

  if(selStu){
    const stu=stuMatrix.find(s=>s.id===selStu);if(!stu)return null;
    const rt=roomAsgns.length>0?Math.round(((stu.submitCount+stu.lateCount)/roomAsgns.length)*100):0;
    return(<div className="p-4 space-y-4 pb-24 lg:pb-6">
      <div className="flex items-center gap-3">
        <button onClick={()=>setSelStu(null)} className={`w-9 h-9 rounded-xl flex items-center justify-center ${dk?"bg-slate-800 text-slate-400":"bg-gray-100 text-gray-600"}`}><Ic n="arr" s={18} c="rotate-180"/></button>
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-cyan-400 to-teal-500 flex items-center justify-center text-white font-bold">{stu.no}</div>
          <div><div className={`font-bold text-sm ${dk?"text-white":"text-gray-900"}`}>{stu.name}</div><div className={`text-xs ${dk?"text-slate-400":"text-gray-500"}`}>เลขที่ {stu.no} · {rooms.find(r=>r.id===activeRoom)?.name}</div></div>
        </div>
      </div>
      <div className="grid grid-cols-3 gap-3">
        {[{label:"ส่งแล้ว",val:stu.submitCount,c:"text-emerald-500",bg:dk?"bg-emerald-500/10":"bg-emerald-50"},{label:"ส่งช้า",val:stu.lateCount,c:"text-amber-500",bg:dk?"bg-amber-500/10":"bg-amber-50"},{label:"ไม่ส่ง",val:stu.notCount,c:"text-red-500",bg:dk?"bg-red-500/10":"bg-red-50"}].map(item=>(
          <div key={item.label} className={`rounded-2xl p-3 text-center border ${dk?"border-slate-700/50":"border-gray-100"} ${item.bg}`}><div className={`text-xl font-bold ${item.c}`}>{item.val}</div><div className={`text-xs mt-0.5 ${dk?"text-slate-400":"text-gray-500"}`}>{item.label}</div></div>
        ))}
      </div>
      <div className={`rounded-2xl p-4 border ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
        <div className="flex justify-between items-center mb-2"><span className={`text-xs font-medium ${dk?"text-slate-400":"text-gray-500"}`}>อัตราการส่งงาน</span><span className="text-xs font-bold text-cyan-500">{rt}%</span></div>
        <div className={`h-3 rounded-full ${dk?"bg-slate-700":"bg-gray-100"} overflow-hidden`}><div className="h-full rounded-full bg-gradient-to-r from-cyan-500 to-teal-400" style={{width:`${rt}%`}}/></div>
      </div>
      <div className={`rounded-2xl border overflow-hidden ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
        <div className={`px-4 py-3 border-b text-xs font-semibold uppercase tracking-wide ${dk?"border-slate-700/50 text-slate-400":"border-gray-50 text-gray-400"}`}>งานทั้งหมด {roomAsgns.length} ชิ้น</div>
        {stu.records.length===0&&<div className={`p-8 text-center text-sm ${dk?"text-slate-500":"text-gray-400"}`}>ยังไม่มีงานในห้องนี้</div>}
        {stu.records.map((r,idx)=>(<div key={r.assignmentId} className={`flex items-center gap-3 px-4 py-3.5 ${idx<stu.records.length-1?dk?"border-b border-slate-700/30":"border-b border-gray-50":""}`}>
          <div className={`w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0 ${r.status==="submitted"?"bg-emerald-500/15 text-emerald-500":r.status==="late"?"bg-amber-500/15 text-amber-500":"bg-red-500/15 text-red-400"}`}><Ic n={r.status==="not_submitted"?"x":"check"} s={15}/></div>
          <div className={`flex-1 min-w-0 text-sm truncate ${dk?"text-slate-200":"text-gray-800"}`}>{r.title}</div>
          <span className={`text-xs px-2.5 py-1 rounded-lg border font-medium flex-shrink-0 ${sCls(r.status,dk)}`}>{sLabel(r.status)}</span>

    </div>
    <div className={`flex rounded-xl p-1 ${dk?"bg-slate-800":"bg-gray-100"}`}>

    </div>

    {viewMode==="overview"&&(<>
      <div className="grid grid-cols-3 gap-3"><Card label="ส่งแล้ว" value={sub} icon="check" color="#10b981" dk={dk}/><Card label="ส่งช้า" value={late} icon="clock" color="#f59e0b" dk={dk}/><Card label="ไม่ส่ง" value={notS} icon="x" color="#ef4444" dk={dk}/></div>
      <div className={`rounded-2xl p-4 border ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
        <div className={`text-sm font-semibold mb-4 ${dk?"text-white":"text-gray-800"}`}>สัดส่วนการส่งงาน</div>
        <div className="flex items-center gap-6">
          <svg viewBox="0 0 120 120" className="w-28 h-28 flex-shrink-0">
            {(()=>{const data=[{val:sub,color:"#10b981"},{val:late,color:"#f59e0b"},{val:notS,color:"#ef4444"}];let cum=0;const tot=sub+late+notS||1;return data.map((d,i)=>{const pct=d.val/tot,sa=cum*2*Math.PI-Math.PI/2,ea=(cum+pct)*2*Math.PI-Math.PI/2,x1=60+50*Math.cos(sa),y1=60+50*Math.sin(sa),x2=60+50*Math.cos(ea),y2=60+50*Math.sin(ea);cum+=pct;if(d.val===0)return null;return<path key={i} d={`M 60 60 L ${x1} ${y1} A 50 50 0 ${pct>0.5?1:0} 1 ${x2} ${y2} Z`} fill={d.color}/>;});})()}
            <circle cx="60" cy="60" r="32" fill={dk?"#1e293b":"#fff"}/><text x="60" y="58" textAnchor="middle" fill={dk?"#fff":"#111"} fontSize="13" fontWeight="bold">{total}</text><text x="60" y="72" textAnchor="middle" fill={dk?"#64748b":"#9ca3af"} fontSize="8">คน</text>
          </svg>
          <div className="space-y-3 flex-1">
            {[{label:"ส่งแล้ว",val:sub,color:"#10b981"},{label:"ส่งช้า",val:late,color:"#f59e0b"},{label:"ไม่ส่ง",val:notS,color:"#ef4444"}].map(i=>{const pct=total?Math.round((i.val/total)*100):0;return(<div key={i.label}><div className="flex items-center justify-between mb-1"><div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full" style={{background:i.color}}/><span className={`text-xs ${dk?"text-slate-400":"text-gray-600"}`}>{i.label}</span></div><span className={`text-xs font-bold ${dk?"text-white":"text-gray-900"}`}>{i.val} ({pct}%)</span></div><div className={`h-1.5 rounded-full ${dk?"bg-slate-700":"bg-gray-100"} overflow-hidden`}><div className="h-full rounded-full" style={{width:`${pct}%`,background:i.color}}/></div></div>);})}
          </div>
        </div>
      </div>
      {roomAsgns.length>0&&(<div className={`rounded-2xl p-4 border ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
        <div className={`text-sm font-semibold mb-4 ${dk?"text-white":"text-gray-800"}`}>การส่งงานแต่ละชิ้น</div>
        <div className="space-y-4">
          {roomAsgns.map(a=>{const seed=a.id*7,subC=Math.max(0,Math.round(total*(0.6+(seed%30)/100))),lateC=Math.max(0,Math.round(total*(0.05+(seed%10)/100))),notC=Math.max(0,total-subC-lateC),tot2=subC+lateC+notC||1,sp=Math.round((subC/tot2)*100),lp=Math.round((lateC/tot2)*100),np=100-sp-lp;return(<div key={a.id}><div className="flex items-center justify-between mb-1.5"><div className={`text-xs font-medium truncate flex-1 mr-2 ${dk?"text-slate-300":"text-gray-700"}`}>{a.title}</div><span className={`text-xs font-bold ${sp+lp>=80?"text-emerald-500":sp+lp>=60?"text-amber-500":"text-red-500"}`}>{sp+lp}%</span></div><div className={`h-5 rounded-lg overflow-hidden flex ${dk?"bg-slate-700":"bg-gray-100"}`}>{sp>0&&<div className="h-full bg-emerald-500 flex items-center justify-center" style={{width:`${sp}%`}}>{sp>8&&<span className="text-white text-[10px] font-bold">{subC}</span>}</div>}{lp>0&&<div className="h-full bg-amber-400 flex items-center justify-center" style={{width:`${lp}%`}}>{lp>8&&<span className="text-white text-[10px] font-bold">{lateC}</span>}</div>}{np>0&&<div className="h-full bg-red-400 flex items-center justify-center" style={{width:`${np}%`}}>{np>8&&<span className="text-white text-[10px] font-bold">{notC}</span>}</div>}</div></div>);})}
        </div>
        <div className="flex gap-4 mt-3">{[{l:"ส่งแล้ว",c:"#10b981"},{l:"ส่งช้า",c:"#f59e0b"},{l:"ไม่ส่ง",c:"#ef4444"}].map(x=>(<div key={x.l} className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-sm" style={{background:x.c}}/><span className={`text-xs ${dk?"text-slate-400":"text-gray-500"}`}>{x.l}</span></div>))}</div>
      </div>)}
      <div className={`rounded-2xl border overflow-hidden ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
        <div className={`px-4 py-3 border-b flex items-center gap-2 ${dk?"border-slate-700/50":"border-gray-50"}`}><div className="w-2 h-2 rounded-full bg-red-500"/><span className={`text-sm font-semibold ${dk?"text-white":"text-gray-800"}`}>นักเรียนที่ไม่ส่งงาน ({notS} คน)</span></div>
        {roomSt.filter(s=>s.status==="not_submitted").length===0?<div className={`p-6 text-center text-sm ${dk?"text-slate-500":"text-gray-400"}`}>🎉 ส่งงานครบทุกคน!</div>:roomSt.filter(s=>s.status==="not_submitted").map((s,idx,arr)=>(<div key={s.id} onClick={()=>{setViewMode("student");setSelStu(s.id);}} className={`flex items-center gap-3 px-4 py-3 cursor-pointer transition-all ${dk?"hover:bg-slate-700/40":"hover:bg-gray-50"} ${idx<arr.length-1?dk?"border-b border-slate-700/30":"border-b border-gray-50":""}`}><div className="w-7 h-7 rounded-full bg-red-500/15 text-red-500 flex items-center justify-center text-xs font-bold">{s.no}</div><div className={`flex-1 text-xs truncate ${dk?"text-slate-300":"text-gray-700"}`}>{s.name}</div><Ic n="arr" s={14} c={dk?"text-slate-600":"text-gray-300"}/></div>))}
      </div>
    </>)}

    {viewMode==="student"&&(<>
      <div className={`flex items-center gap-2 px-3 py-2.5 rounded-xl border ${dk?"bg-slate-800 border-slate-700":"bg-white border-gray-200"}`}><Ic n="search" s={15} c={dk?"text-slate-500":"text-gray-400"}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหาชื่อหรือเลขที่..." className={`flex-1 bg-transparent text-sm outline-none ${dk?"text-white placeholder-slate-500":"text-gray-900 placeholder-gray-400"}`}/></div>
      <div className="space-y-2">
        {filteredStu.map(s=>{const rt2=roomAsgns.length>0?Math.round(((s.submitCount+s.lateCount)/roomAsgns.length)*100):0;return(<button key={s.id} onClick={()=>setSelStu(s.id)} className={`w-full text-left rounded-2xl p-3 border active:scale-[0.99] ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-400 to-teal-500 flex items-center justify-center text-white text-sm font-bold flex-shrink-0">{s.no}</div>
            <div className="flex-1 min-w-0"><div className={`text-sm font-medium truncate ${dk?"text-white":"text-gray-900"}`}>{s.name}</div><div className="flex gap-3 mt-1"><span className="text-[10px] text-emerald-500 font-medium">✓ {s.submitCount}</span><span className="text-[10px] text-amber-500 font-medium">⏱ {s.lateCount}</span><span className="text-[10px] text-red-400 font-medium">✗ {s.notCount}</span></div></div>
            <div className="flex items-center gap-2"><span className={`text-sm font-bold ${rt2>=80?"text-emerald-500":rt2>=60?"text-amber-500":"text-red-500"}`}>{rt2}%</span><Ic n="arr" s={15} c={dk?"text-slate-600":"text-gray-300"}/></div>
          </div>
          {roomAsgns.length>0&&(<div className={`mt-2 h-1.5 rounded-full ${dk?"bg-slate-700":"bg-gray-100"} overflow-hidden flex`}><div className="h-full bg-emerald-500" style={{width:`${(s.submitCount/roomAsgns.length)*100}%`}}/><div className="h-full bg-amber-400" style={{width:`${(s.lateCount/roomAsgns.length)*100}%`}}/><div className="h-full bg-red-400" style={{width:`${(s.notCount/roomAsgns.length)*100}%`}}/></div>)}
        </button>);})}
      </div>
    </>)}
  </div>);
}

// ── SHARE ───────────────────────────────────────────────────────
function SharePage({rooms,students,dk}){
  const[showQR,setShowQR]=useState(false);
  const[activeRoom,setActiveRoom]=useState(rooms[0]?.id);
  const roomSt=students[activeRoom]||[];
  const sub=roomSt.filter(s=>s.status!=="not_submitted").length;
  const rate=roomSt.length?Math.round((sub/roomSt.length)*100):0;
  return(<div className="p-4 space-y-5 pb-24 lg:pb-6">
    <div className={`rounded-2xl p-4 border ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
      <div className={`text-xs font-semibold mb-3 uppercase tracking-wide ${dk?"text-slate-400":"text-gray-500"}`}>Preview การแชร์</div>
      <div className="flex gap-2 mb-3 overflow-x-auto pb-1">{rooms.map(r=>(<button key={r.id} onClick={()=>setActiveRoom(r.id)} className="flex-shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium border transition-all" style={activeRoom===r.id?{background:r.color,color:"white",borderColor:r.color}:{borderColor:dk?"#334155":"#e5e7eb",color:dk?"#94a3b8":"#6b7280"}}>{r.name}</button>))}</div>
      <div className="rounded-2xl overflow-hidden border border-cyan-500/30"><div className="h-2 bg-gradient-to-r from-cyan-500 to-teal-400"/>
        <div className="p-4 bg-gradient-to-br from-cyan-500/5 to-teal-500/5">
          <div className="flex items-center gap-2 mb-3"><div className="w-8 h-8 rounded-xl bg-gradient-to-br from-cyan-500 to-teal-500 flex items-center justify-center"><Ic n="zap" s={16} c="text-white"/></div><div><div className={`text-xs font-bold ${dk?"text-white":"text-gray-900"}`}>AssignCheck Pro</div><div className={`text-xs ${dk?"text-slate-400":"text-gray-500"}`}>รายงานการส่งงาน</div></div></div>
          <div className={`text-sm font-bold mb-1 ${dk?"text-white":"text-gray-900"}`}>{rooms.find(r=>r.id===activeRoom)?.name} · {rooms.find(r=>r.id===activeRoom)?.subject}</div>
          <div className="flex gap-4 text-xs"><span className={dk?"text-slate-400":"text-gray-500"}>ส่งงาน {sub}/{roomSt.length} คน</span><span className={`font-bold ${rate>=80?"text-emerald-500":rate>=60?"text-amber-500":"text-red-500"}`}>{rate}%</span></div>
          <div className={`mt-2 h-2 rounded-full ${dk?"bg-slate-700":"bg-gray-200"} overflow-hidden`}><div className="h-full rounded-full bg-gradient-to-r from-cyan-500 to-teal-400" style={{width:`${rate}%`}}/></div>
        </div>
      </div>
    </div>
    <div className={`rounded-2xl p-4 border ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
      <div className={`text-sm font-semibold mb-4 ${dk?"text-white":"text-gray-800"}`}>แชร์ผ่าน</div>
      <div className="grid grid-cols-4 gap-3">
        {[{label:"LINE",color:"#00B900",bg:"#00B90015",icon:"share"},{label:"Facebook",color:"#1877F2",bg:"#1877F215",icon:"share"},{label:"Email",color:"#ea4335",bg:"#ea433515",icon:"mail"},{label:"QR Code",color:"#6366f1",bg:"#6366f115",icon:"copy",fn:()=>setShowQR(true)},{label:"Copy Link",color:"#06b6d4",bg:"#06b6d415",icon:"copy",fn:()=>toast("คัดลอกลิงก์แล้ว!","success")},{label:"PDF",color:"#10b981",bg:"#10b98115",icon:"dl"},{label:"CSV",color:"#f59e0b",bg:"#f59e0b15",icon:"dl"},{label:"Excel",color:"#22c55e",bg:"#22c55e15",icon:"dl"}].map(a=>(
          <button key={a.label} onClick={a.fn||(()=>toast(`แชร์ผ่าน ${a.label}`,"success"))} className="flex flex-col items-center gap-2 p-3 rounded-2xl active:scale-95 transition-all" style={{background:a.bg}}>
            <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{background:a.color+"22",color:a.color}}><Ic n={a.icon} s={20}/></div>
            <span className={`text-xs font-medium ${dk?"text-slate-300":"text-gray-700"}`}>{a.label}</span>
          </button>
        ))}
      </div>
    </div>
    {showQR&&(<div className="fixed inset-0 z-50 flex items-end lg:items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={()=>setShowQR(false)}>
      <div className={`w-full max-w-sm rounded-3xl p-6 text-center ${dk?"bg-slate-800":"bg-white"} shadow-2xl`} onClick={e=>e.stopPropagation()}>
        <div className={`text-base font-bold mb-4 ${dk?"text-white":"text-gray-900"}`}>QR Code แชร์ผล</div>
        <div className="w-48 h-48 mx-auto bg-white rounded-2xl p-3 shadow-lg mb-4">
          <svg viewBox="0 0 100 100" className="w-full h-full">
            {Array.from({length:10},(_,row)=>Array.from({length:10},(_,col)=>{const d=(row+col*3+row*col)%3!==0;return d?<rect key={`${row}-${col}`} x={col*10} y={row*10} width="10" height="10" fill="#0e7490"/>:null;}))}
            <rect x="5" y="5" width="25" height="25" rx="3" fill="#0e7490"/><rect x="9" y="9" width="17" height="17" rx="2" fill="white"/><rect x="12" y="12" width="11" height="11" rx="1" fill="#0e7490"/>
            <rect x="70" y="5" width="25" height="25" rx="3" fill="#0e7490"/><rect x="74" y="9" width="17" height="17" rx="2" fill="white"/><rect x="77" y="12" width="11" height="11" rx="1" fill="#0e7490"/>
            <rect x="5" y="70" width="25" height="25" rx="3" fill="#0e7490"/><rect x="9" y="74" width="17" height="17" rx="2" fill="white"/><rect x="12" y="77" width="11" height="11" rx="1" fill="#0e7490"/>
          </svg>
        </div>
        <div className={`text-xs mb-4 ${dk?"text-slate-400":"text-gray-500"}`}>สแกนเพื่อดูรายงานการส่งงาน</div>
        <button onClick={()=>setShowQR(false)} className="w-full py-3 rounded-2xl bg-cyan-500 text-white font-medium">ปิด</button>
      </div>
    </div>)}
  </div>);
}

// ── SETTINGS ────────────────────────────────────────────────────
function SettingsPage({dk,toggleDk}){
  const[notif,setNotif]=useState(true);
  const[autoSave,setAutoSave]=useState(true);
  function Toggle({on,toggle}){return(<button onClick={toggle} className={`w-12 h-6 rounded-full transition-all relative ${on?"bg-cyan-500":dk?"bg-slate-700":"bg-gray-200"}`}><div className={`w-5 h-5 rounded-full bg-white shadow-sm absolute top-0.5 transition-all ${on?"left-6":"left-0.5"}`}/></button>);}
  return(<div className="p-4 space-y-5 pb-24 lg:pb-6">
    <div className={`rounded-2xl p-4 border ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
      <div className="flex items-center gap-4">
        <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan-500 to-teal-500 flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-cyan-500/30">ธ</div>
        <div><div className={`font-bold ${dk?"text-white":"text-gray-900"}`}>นายธนกฤต</div><div className={`text-sm ${dk?"text-slate-400":"text-gray-500"}`}>ครูคณิตศาสตร์</div><div className={`text-xs mt-1 ${dk?"text-slate-500":"text-gray-400"}`}>โรงเรียนหล่มสักวิทยาคม · สพม.เพชรบูรณ์</div></div>
      </div>
    </div>
    {[{title:"ทั่วไป",items:[{label:"Dark Mode",sub:"โหมดมืด",el:<Toggle on={dk} toggle={toggleDk}/>},{label:"Auto Save",sub:"บันทึกอัตโนมัติ",el:<Toggle on={autoSave} toggle={()=>setAutoSave(p=>!p)}/>}]},{title:"การแจ้งเตือน",items:[{label:"Push Notification",sub:"แจ้งเตือนบนมือถือ",el:<Toggle on={notif} toggle={()=>setNotif(p=>!p)}/>}]},{title:"แอปพลิเคชัน",items:[{label:"Version",sub:"AssignCheck Pro 1.0.0",el:<span className={`text-xs ${dk?"text-slate-500":"text-gray-400"}`}>v1.0.0</span>}]}].map(sec=>(
      <div key={sec.title} className={`rounded-2xl border overflow-hidden ${dk?"bg-slate-800/60 border-slate-700/50":"bg-white border-gray-100"} shadow-sm`}>
        <div className={`px-4 py-3 border-b text-xs font-semibold uppercase tracking-wider ${dk?"border-slate-700/50 text-slate-400":"border-gray-50 text-gray-400"}`}>{sec.title}</div>
        {sec.items.map((item,idx)=>(<div key={idx} className={`flex items-center justify-between px-4 py-3.5 ${idx<sec.items.length-1?dk?"border-b border-slate-700/30":"border-b border-gray-50":""}`}><div><div className={`text-sm font-medium ${dk?"text-white":"text-gray-900"}`}>{item.label}</div><div className={`text-xs ${dk?"text-slate-500":"text-gray-400"}`}>{item.sub}</div></div>{item.el}</div>))}
      </div>
    ))}
  </div>);
}

// ── APP ─────────────────────────────────────────────────────────
function App(){
  const[dk,setDk]=useState(false);
  const[page,setPage]=useState("dashboard");
  const[rooms,setRooms]=useState(INIT_ROOMS);
  const[students,setStudents]=useState(INIT_STUDENTS);
  const[asgns,setAsgns]=useState(INIT_ASGNS);
  const[fabTrigger,setFabTrigger]=useState(0);
  const titles={dashboard:"Dashboard",classroom:"ห้องเรียน",assignment:"เช็คงาน",reports:"รายงาน",share:"แชร์ & ส่งออก",settings:"ตั้งค่า"};
  const pages={
    dashboard:<DashboardPage rooms={rooms} asgns={asgns} students={students} dk={dk} setPage={setPage}/>,
    classroom:<ClassroomPage rooms={rooms} setRooms={setRooms} students={students} setStudents={setStudents} dk={dk}/>,
    assignment:<AssignmentPage rooms={rooms} asgns={asgns} setAsgns={setAsgns} students={students} setStudents={setStudents} dk={dk} fabTrigger={fabTrigger}/>,
    reports:<ReportsPage rooms={rooms} students={students} asgns={asgns} dk={dk}/>,
    share:<SharePage rooms={rooms} students={students} dk={dk}/>,
    settings:<SettingsPage dk={dk} toggleDk={()=>setDk(p=>!p)}/>,
  };
  return(<div className={`${dk?"dark bg-slate-950":"bg-gray-50"} h-screen overflow-hidden`} style={{fontFamily:"'Prompt',sans-serif"}}>
    <ToastHost/>
    <div className="flex h-full">
      <Sidebar page={page} setPage={setPage} dk={dk}/>
      <main className={`flex-1 flex flex-col min-w-0 overflow-hidden ${dk?"bg-slate-950":"bg-gray-50"}`}>
        <Header title={titles[page]} dk={dk} toggleDk={()=>setDk(p=>!p)}/>
        <div className="flex-1 overflow-y-auto overscroll-contain">{pages[page]}</div>
      </main>
    </div>
    <BNav page={page} setPage={setPage} dk={dk}/>
    <button onClick={()=>{setPage("assignment");setFabTrigger(p=>p+1);}} className="fixed right-4 bottom-20 lg:bottom-6 z-40 w-14 h-14 rounded-2xl bg-gradient-to-br from-cyan-500 to-teal-500 shadow-xl shadow-cyan-500/40 flex items-center justify-center transition-all active:scale-90 hover:scale-110" title="เพิ่มงานใหม่"><Ic n="plus" s={24} c="text-white"/></button>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
