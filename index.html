<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f46e5">
<title>ClassCheck Pro</title>

<!-- Google Fonts: Sarabun -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase compat SDK v9 compat layer -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- React 18 -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- ===================== GLOBAL STYLES ===================== -->
<style>
/* ── Reset & base ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{
  font-family:'Sarabun','Segoe UI',system-ui,sans-serif;
  background:linear-gradient(135deg,#f0f4ff 0%,#faf9ff 50%,#f0f9f4 100%);
  background-attachment:fixed;
  color:#1a1f2e;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font-family:inherit}
*::-webkit-scrollbar{width:5px;height:5px}
*::-webkit-scrollbar-thumb{background:rgba(79,70,229,.25);border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}

/* ── Animations ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ── Loading screen ── */
#app-loading{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(135deg,#f0f4ff 0%,#faf9ff 100%);
  z-index:9999;gap:16px
}
#app-loading .spinner{
  width:40px;height:40px;border:3px solid rgba(79,70,229,.2);
  border-top-color:#4f46e5;border-radius:50%;
  animation:spin .8s linear infinite
}
#app-loading p{color:#6b7280;font-size:14px;animation:pulse 1.5s ease infinite}

/* ── Card ── */
.card{
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.6);
  border-radius:16px;
  box-shadow:0 4px 24px rgba(79,70,229,.06),0 1px 4px rgba(0,0,0,.04);
}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;
  cursor:pointer;border:none;transition:all .18s ease;white-space:nowrap;
  font-family:inherit;
}
.btn:active{transform:scale(.96)}
.btn-ghost{background:rgba(255,255,255,.7);color:#374151;border:1px solid rgba(107,114,128,.2)}
.btn-ghost:hover{background:#fff;border-color:rgba(79,70,229,.3);color:#4f46e5}
.btn-primary{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;box-shadow:0 2px 12px rgba(79,70,229,.35)}
.btn-primary:hover{background:linear-gradient(135deg,#4338ca,#4f46e5);box-shadow:0 4px 18px rgba(79,70,229,.45)}
.btn-success{background:linear-gradient(135deg,#059669,#10b981);color:#fff;box-shadow:0 2px 12px rgba(16,185,129,.3)}
.btn-success:hover{background:linear-gradient(135deg,#047857,#059669)}
.btn-danger{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;box-shadow:0 2px 12px rgba(220,38,38,.25)}
.btn-danger:hover{background:linear-gradient(135deg,#b91c1c,#dc2626)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn-icon{padding:8px;border-radius:8px;width:36px;height:36px}

/* ── Form controls ── */
.form-input{
  width:100%;padding:10px 14px;border-radius:10px;
  border:1.5px solid rgba(107,114,128,.18);
  background:rgba(255,255,255,.8);color:#1a1f2e;
  font-size:14px;font-family:inherit;
  transition:all .15s;
}
.form-input:focus{
  outline:none;border-color:#4f46e5;
  box-shadow:0 0 0 3px rgba(79,70,229,.12);
  background:#fff;
}
.form-input::placeholder{color:#9ca3af}
.form-label{font-size:12px;font-weight:600;color:#6b7280;letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px;display:block}

/* ── Badge / tag ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.badge-purple{background:rgba(99,102,241,.1);color:#4f46e5}
.badge-green{background:rgba(16,185,129,.1);color:#059669}
.badge-amber{background:rgba(245,158,11,.12);color:#d97706}
.badge-red{background:rgba(239,68,68,.1);color:#dc2626}
.badge-gray{background:rgba(107,114,128,.1);color:#6b7280}

/* ── Stat cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.8)}
.stat-card.purple{background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(99,102,241,.03))}
.stat-card.green{background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(16,185,129,.03))}
.stat-card.amber{background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(245,158,11,.03))}
.stat-card.red{background:linear-gradient(135deg,rgba(239,68,68,.08),rgba(239,68,68,.03))}
.stat-label{font-size:11px;font-weight:600;color:#9ca3af;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.stat-value{font-size:26px;font-weight:700;line-height:1}
.stat-value.purple{color:#4f46e5}
.stat-value.green{color:#059669}
.stat-value.amber{color:#d97706}
.stat-value.red{color:#dc2626}
.stat-sub{font-size:11px;color:#9ca3af;margin-top:3px}

/* ── Table ── */
.table-wrap{overflow-x:auto;border-radius:14px;border:1px solid rgba(229,231,235,.6)}
table.main-table{width:100%;border-collapse:collapse;font-size:14px;min-width:500px}
table.main-table thead th{
  padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:#6b7280;
  background:rgba(249,250,251,.95);
  border-bottom:1px solid rgba(229,231,235,.7);
  white-space:nowrap;
}
table.main-table tbody td{
  padding:10px 14px;
  border-bottom:1px solid rgba(229,231,235,.4);
  vertical-align:middle;
  transition:background .1s;
}
table.main-table tbody tr:last-child td{border-bottom:none}
table.main-table tbody tr:hover td{background:rgba(99,102,241,.03)}
table.main-table .col-center{text-align:center}

/* ── Checkbox cell ── */
.check-cell{display:flex;align-items:center;justify-content:center}
.check-btn{
  width:28px;height:28px;border-radius:7px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(209,213,219,.8);
  background:rgba(255,255,255,.6);
  transition:all .15s ease;font-size:14px;font-weight:700;
  flex-shrink:0;
}
.check-btn:hover{border-color:#4f46e5;background:rgba(99,102,241,.06);transform:scale(1.08)}
.check-btn.submitted{background:#4f46e5;border-color:#4f46e5;color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.35)}
.check-btn.late{background:#f59e0b;border-color:#d97706;color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.3)}
.check-btn.absent{background:rgba(239,68,68,.1);border-color:#fca5a5;color:#dc2626}

/* ── Score input ── */
.score-inp{
  width:64px;padding:6px 8px;border-radius:7px;
  border:1.5px solid rgba(209,213,219,.6);
  background:rgba(255,255,255,.7);color:#1a1f2e;
  font-size:13px;font-weight:600;text-align:center;
  transition:all .15s;
}
.score-inp:focus{outline:none;border-color:#4f46e5;background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.1)}

/* ── Student name cell ── */
.stu-name{font-weight:600;color:#111827;font-size:14px}
.stu-no{font-size:11px;color:#9ca3af;margin-top:1px}

/* ── Legend ── */
.legend{display:flex;gap:16px;font-size:12px;color:#6b7280;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:12px;height:12px;border-radius:3px}

/* ── Tag chip ── */
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px 4px 12px;border-radius:99px;font-size:13px;
  background:rgba(99,102,241,.08);color:#4f46e5;
  border:1px solid rgba(99,102,241,.15);
}
.tag-remove{background:none;border:none;cursor:pointer;color:rgba(99,102,241,.6);padding:0;display:flex;align-items:center;font-size:14px;line-height:1}
.tag-remove:hover{color:#dc2626}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(17,24,39,.5);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:9000;
  animation:fadeIn .2s ease;padding:16px;
}
.modal-box{
  background:#fff;border-radius:20px;padding:28px;
  max-width:440px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
  animation:slideUp .25s ease;
}
.modal-title{font-size:18px;font-weight:700;color:#111827;margin-bottom:20px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ── Section header ── */
.section-hd{font-size:12px;font-weight:700;color:#6b7280;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}

/* ── Login screen ── */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.login-card{max-width:420px;width:100%;padding:40px 36px}
.login-logo{font-size:32px;font-weight:800;color:#4f46e5;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.login-sub{color:#6b7280;font-size:15px;margin-bottom:32px}
.login-divider{display:flex;align-items:center;gap:12px;color:#9ca3af;font-size:13px;margin:18px 0}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:#e5e7eb}

/* ── App layout ── */
.app-wrap{display:flex;flex-direction:column;min-height:100vh}

/* ── Topbar ── */
.topbar{
  position:sticky;top:0;z-index:100;
  padding:0 20px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(229,231,235,.6);
  display:flex;align-items:center;height:58px;gap:12px;
}
.topbar-logo{font-size:18px;font-weight:800;color:#4f46e5;display:flex;align-items:center;gap:7px}
.topbar-logo svg{width:22px;height:22px}
.topbar-spacer{flex:1}

/* ── Sidebar ── */
.sidebar{
  width:260px;flex-shrink:0;
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-right:1px solid rgba(229,231,235,.5);
  padding:16px 12px;overflow-y:auto;
  display:flex;flex-direction:column;gap:4px;
}
.sidebar-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  font-size:14px;font-weight:500;color:#374151;
  cursor:pointer;transition:all .15s;border:none;background:none;
  text-align:left;width:100%;
}
.sidebar-item:hover{background:rgba(99,102,241,.06);color:#4f46e5}
.sidebar-item.active{background:rgba(99,102,241,.1);color:#4f46e5;font-weight:600}
.sidebar-item svg,.sidebar-item span{flex-shrink:0}
.sidebar-section{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px 4px;margin-top:8px}
.sidebar-add{
  margin:4px 4px 0;
  border:1.5px dashed rgba(99,102,241,.3);
  background:rgba(99,102,241,.04);
  color:#6b7280;font-size:13px;
}
.sidebar-add:hover{border-color:#4f46e5;color:#4f46e5;background:rgba(99,102,241,.08)}

/* ── Main content ── */
.main-body{flex:1;display:flex;overflow:hidden}
.main-content{flex:1;overflow-y:auto;padding:24px}

/* ── Page header ── */
.page-header{margin-bottom:20px;animation:fadeIn .3s ease}
.page-title{font-size:22px;font-weight:800;color:#111827;display:flex;align-items:center;gap:10px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ── Checklist grid ── */
.check-section{animation:fadeIn .3s ease}

/* ── Empty state ── */
.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.5}
.empty-text{font-size:16px;font-weight:600;color:#6b7280;margin-bottom:8px}
.empty-sub{font-size:14px}

/* ── Progress bar ── */
.progress-wrap{height:6px;background:rgba(229,231,235,.6);border-radius:99px;overflow:hidden;margin-top:6px}
.progress-bar{height:100%;border-radius:99px;transition:width .4s ease;background:linear-gradient(90deg,#4f46e5,#6366f1)}

/* ── Toast ── */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:#111827;color:#fff;
  padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
  z-index:9999;animation:slideUp .25s ease;
  display:flex;align-items:center;gap:8px;
}

/* ── Tab bar ── */
.tab-bar{display:flex;gap:4px;background:rgba(243,244,246,.8);padding:4px;border-radius:10px;margin-bottom:16px}
.tab-item{flex:1;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;transition:all .15s;text-align:center;border:none;background:none;font-family:inherit}
.tab-item.active{background:#fff;color:#4f46e5;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.tab-item:hover:not(.active){color:#374151;background:rgba(255,255,255,.6)}

/* ── Responsive ── */
@media(max-width:768px){
  .sidebar{display:none}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .main-content{padding:16px}
  .topbar{padding:0 14px}
}
</style>
</head>

<div id="app-loading">
  <div class="spinner"></div>
  <p>กำลังโหลด ClassCheck Pro...</p>
</div>
<div id="root"></div>

<!-- ===================== FIREBASE CONFIG ===================== -->
<script>

<!-- ===================== REACT APP ===================== -->
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ───── helpers ───── */
function formatThaiDate(d){
  if(!d) return '';
  const date = d instanceof Date ? d : new Date(d);
  return date.toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'});
}
function today(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ───── Toast ───── */
function Toast({msg,onDone}){
  useEffect(()=>{ const t=setTimeout(onDone,2800); return()=>clearTimeout(t); },[]);
  return <div className="toast">✓ {msg}</div>;
}

/* ───── Confirm dialog ───── */
function Confirm({msg,onOk,onCancel}){
  return(
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal-box" style={{maxWidth:360}} onClick={e=>e.stopPropagation()}>
        <div className="modal-title" style={{fontSize:16}}>{msg}</div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onCancel}>ยกเลิก</button>
          <button className="btn btn-danger" onClick={onOk}>ยืนยัน</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   LOGIN SCREEN
══════════════════════════════════════════════ */
function LoginScreen({onLogin}){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  const [mode,setMode]=useState('login'); // login | register

  async function handleSubmit(e){
    e.preventDefault(); setErr(''); setLoading(true);
    try{
      if(mode==='login'){
        await window._fb.auth.signInWithEmailAndPassword(email,pass);
      } else {
        await window._fb.auth.createUserWithEmailAndPassword(email,pass);
      }
    } catch(e2){
      const map={'auth/user-not-found':'ไม่พบบัญชีนี้','auth/wrong-password':'รหัสผ่านไม่ถูกต้อง','auth/email-already-in-use':'อีเมลนี้มีบัญชีแล้ว','auth/weak-password':'รหัสผ่านต้องมีอย่างน้อย 6 ตัว','auth/invalid-email':'รูปแบบอีเมลไม่ถูกต้อง','auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง'};
      setErr(map[e2.code]||e2.message);
    } finally{ setLoading(false); }
  }

  async function loginGoogle(){
    setErr(''); setLoading(true);
    try{
      const prov=new firebase.auth.GoogleAuthProvider();
      await window._fb.auth.signInWithPopup(prov);
    } catch(e2){ setErr(e2.message); } finally{ setLoading(false); }
  }

  async function resetPass(){
    if(!email){ setErr('กรอกอีเมลก่อนแล้วกดลืมรหัส'); return; }
    try{ await window._fb.auth.sendPasswordResetEmail(email); alert('ส่งลิงก์รีเซ็ตรหัสผ่านไปที่ '+email+' แล้ว'); }
    catch(e2){ setErr(e2.message); }
  }

  return(
    <div className="login-wrap">
      <div className="card login-card">
        <div className="login-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          ClassCheck Pro
        </div>
        <div className="login-sub">{mode==='login'?'ยินดีต้อนรับ! เข้าสู่ระบบเพื่อจัดการงาน':'สร้างบัญชีใหม่'}</div>

        <button className="btn btn-ghost" onClick={loginGoogle} disabled={loading}
          style={{width:'100%',marginBottom:4,padding:'10px 16px',border:'1px solid #e5e7eb',borderRadius:10}}>
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          เข้าสู่ระบบด้วย Google
        </button>

        <div className="login-divider">หรือ</div>

        <form onSubmit={handleSubmit} style={{display:'flex',flexDirection:'column',gap:12}}>
          <div>
            <label className="form-label">อีเมล</label>
            <input className="form-input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="teacher@school.ac.th" required/>
          </div>
          <div>
            <label className="form-label">รหัสผ่าน</label>
            <input className="form-input" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" required minLength={6}/>
          </div>
          {err && <div style={{color:'#dc2626',fontSize:13,background:'rgba(220,38,38,.06)',padding:'8px 12px',borderRadius:8,border:'1px solid rgba(220,38,38,.15)'}}>{err}</div>}
          <button className="btn btn-primary" type="submit" disabled={loading} style={{width:'100%',padding:'11px'}}>
            {loading?'กำลังดำเนินการ...':(mode==='login'?'เข้าสู่ระบบ':'สมัครสมาชิก')}
          </button>
        </form>

        <div style={{display:'flex',justifyContent:'space-between',marginTop:16,fontSize:13}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>{setMode(m=>m==='login'?'register':'login');setErr('')}}>
            {mode==='login'?'สมัครสมาชิก':'← กลับเข้าสู่ระบบ'}
          </button>
          {mode==='login' && <button className="btn btn-ghost btn-sm" onClick={resetPass}>ลืมรหัสผ่าน?</button>}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   STUDENT MODAL — add students
══════════════════════════════════════════════ */
function StudentModal({onSave,onClose}){
  const [mode,setMode]=useState('single');
  const [name,setName]=useState('');
  const [no,setNo]=useState('');
  const [bulk,setBulk]=useState('');

  function save(){
    const list=[];
    if(mode==='single'){
      if(!name.trim()) return;
      list.push({name:name.trim(),studentNo:no.trim()});
    } else {
      bulk.split('\n').forEach(line=>{
        const parts=line.trim().split(/\t|,/);
        const n=parts[0]?.trim();
        if(n) list.push({name:n,studentNo:(parts[1]?.trim()||'')});
      });
    }
    if(list.length) onSave(list);
  }

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">เพิ่มนักเรียน</div>
        <div className="tab-bar" style={{marginBottom:16}}>
          <button className={`tab-item${mode==='single'?' active':''}`} onClick={()=>setMode('single')}>เพิ่มทีละคน</button>
          <button className={`tab-item${mode==='bulk'?' active':''}`} onClick={()=>setMode('bulk')}>วางรายชื่อ (หลายคน)</button>
        </div>
        {mode==='single'?(
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <div>
              <label className="form-label">ชื่อ-นามสกุล *</label>
              <input className="form-input" value={name} onChange={e=>setName(e.target.value)} placeholder="เด็กชาย/เด็กหญิง ชื่อ นามสกุล"
                onKeyDown={e=>{ if(e.key==='Enter') save(); }}/>
            </div>
            <div>
              <label className="form-label">เลขประจำตัว</label>
              <input className="form-input" value={no} onChange={e=>setNo(e.target.value)} placeholder="เช่น 001"/>
            </div>
          </div>
        ):(
          <div>
            <label className="form-label">วางรายชื่อ (1 คนต่อบรรทัด, คั่นด้วย Tab หรือ , สำหรับเลขประจำตัว)</label>
            <textarea className="form-input" rows={7} value={bulk} onChange={e=>setBulk(e.target.value)}
              placeholder={"เด็กชาย ตัวอย่าง ทดสอบ\nเด็กหญิง ตัวอย่าง ทดสอบ,002\nเด็กชาย ตัวอย่าง สาม\t003"}/>
          </div>
        )}
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
          <button className="btn btn-primary" onClick={save}>เพิ่ม</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   CHECK TABLE — main submission grid
══════════════════════════════════════════════ */
const STATUS_ORDER = ['none','submitted','late','absent'];
const STATUS_LABEL = {none:'ยังไม่ส่ง',submitted:'ส่งแล้ว',late:'ส่งช้า',absent:'ขาด'};
const STATUS_CLASS = {none:'',submitted:'submitted',late:'late',absent:'absent'};
const STATUS_ICON  = {none:'',submitted:'✓',late:'!',absent:'✗'};

function CheckTable({assignment,students,records,onToggle,onScore}){
  const submitted=Object.values(records).filter(r=>r.status==='submitted').length;
  const late=Object.values(records).filter(r=>r.status==='late').length;
  const absent=Object.values(records).filter(r=>r.status==='absent').length;
  const total=students.length||1;
  const pct=Math.round(submitted/total*100);

  function nextStatus(cur){
    const i=STATUS_ORDER.indexOf(cur||'none');
    return STATUS_ORDER[(i+1)%STATUS_ORDER.length];
  }

  return(
    <div className="check-section">
      {/* Stats */}
      <div className="stat-grid" style={{marginBottom:16}}>
        <div className="stat-card purple card">
          <div className="stat-label">ทั้งหมด</div>
          <div className="stat-value purple">{students.length}</div>
          <div className="stat-sub">นักเรียน</div>
        </div>
        <div className="stat-card green card">
          <div className="stat-label">ส่งแล้ว</div>
          <div className="stat-value green">{submitted}</div>
          <div className="progress-wrap"><div className="progress-bar" style={{width:pct+'%'}}/></div>
        </div>
        <div className="stat-card amber card">
          <div className="stat-label">ส่งช้า</div>
          <div className="stat-value amber">{late}</div>
          <div className="stat-sub">คน</div>
        </div>
        <div className="stat-card red card">
          <div className="stat-label">ไม่ส่ง/ขาด</div>
          <div className="stat-value red">{absent+Object.values(records).filter(r=>!r.status||r.status==='none').length}</div>
          <div className="stat-sub">คน</div>
        </div>
      </div>

      {/* Legend */}
      <div className="legend" style={{marginBottom:12}}>
        {STATUS_ORDER.map(s=>(
          <div key={s} className="legend-item">
            <div className="legend-dot" style={{
              background:s==='submitted'?'#4f46e5':s==='late'?'#f59e0b':s==='absent'?'rgba(239,68,68,.3)':'rgba(209,213,219,.6)',
              border:s==='none'?'2px solid rgba(209,213,219,.8)':undefined
            }}/>
            <span>{STATUS_LABEL[s]}</span>
          </div>
        ))}
        <span style={{marginLeft:'auto',fontSize:12,color:'#9ca3af'}}>คลิกที่ช่องเพื่อเปลี่ยนสถานะ</span>
      </div>

      {students.length===0?(
        <div className="empty-state card" style={{padding:'40px 20px'}}>
          <div className="empty-icon">👥</div>
          <div className="empty-text">ยังไม่มีนักเรียน</div>
          <div className="empty-sub">กด "+ เพิ่มนักเรียน" ด้านบน</div>
        </div>
      ):(
        <div className="card table-wrap">
          <table className="main-table">
            <thead>
              <tr>
                <th style={{width:44}}>#</th>
                <th>ชื่อ-นามสกุล</th>
                <th className="col-center" style={{width:110}}>สถานะ</th>
                <th className="col-center" style={{width:80}}>คะแนน</th>
                <th className="col-center" style={{width:80}}>/{assignment.maxScore||10}</th>
              </tr>
            </thead>
            <tbody>
              {students.map((s,i)=>{
                const rec=records[s.id]||{};
                const st=rec.status||'none';
                return(
                  <tr key={s.id}>
                    <td style={{color:'#9ca3af',fontSize:12,textAlign:'center'}}>{i+1}</td>
                    <td>
                      <div className="stu-name">{s.name}</div>
                      {s.studentNo&&<div className="stu-no">เลขที่ {s.studentNo}</div>}
                    </td>
                    <td className="col-center">
                      <div className="check-cell">
                        <div className={`check-btn ${STATUS_CLASS[st]}`}
                          onClick={()=>onToggle(s.id,nextStatus(st))}
                          title={`${STATUS_LABEL[st]} → คลิกเพื่อเปลี่ยน`}>
                          {STATUS_ICON[st]}
                        </div>
                        <span style={{fontSize:11,color:'#9ca3af',marginLeft:5,minWidth:44}}>{STATUS_LABEL[st]}</span>
                      </div>
                    </td>
                    <td className="col-center">
                      <input className="score-inp" type="number" min={0} max={assignment.maxScore||100}
                        value={rec.score??''}
                        onChange={e=>onScore(s.id,e.target.value)}
                        placeholder="-"/>
                    </td>
                    <td className="col-center" style={{fontSize:12,color:'#9ca3af'}}>/{assignment.maxScore||10}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function exportPDF(cls,assignment,students,records){
  const sub=students.length;
  const late=Object.values(records).filter(r=>r.status==='late').length;

  const pct=Math.round(Object.values(records).filter(r=>r.status==='submitted').length/Math.max(students.length,1)*100);

  const rows=students.map((s,i)=>{
    const rec=records[s.id]||{};
    const st=rec.status||'none';
    const sym=st==='submitted'?'✓':st==='late'?'!':st==='absent'?'✗':'-';
    const bg=st==='submitted'?'#d1fae5':st==='late'?'#fef3c7':st==='absent'?'#fee2e2':'#f9fafb';
    const col=st==='submitted'?'#065f46':st==='late'?'#92400e':st==='absent'?'#991b1b':'#9ca3af';

    return `<tr>

  const [students,setStudents]=useState([]);

  const [toast,setToast]=useState('');
  const [modal,setModal]=useState(null); // 'newClass'|'editClass'|'newStudent'|'newAssignment'|'confirmDeleteClass'|'confirmDeleteAssignment'
  const [loading,setLoading]=useState(false);

  const showToast=(msg)=>{ setToast(msg); };

  /* Auth listener */
  useEffect(()=>{
    const unsub=window._fb.auth.onAuthStateChanged(u=>{ setUser(u); setAuthReady(true); });
    return unsub;
  },[]);

  /* Hide loading screen */
  useEffect(()=>{
    if(authReady) document.getElementById('app-loading').style.display='none';
  },[authReady]);

  /* Load classes */
  useEffect(()=>{
    if(!user) return;
    const unsub=window._fb.db.collection('users').doc(user.uid).collection('classes')
      .orderBy('createdAt','desc')
      .onSnapshot(snap=>{
        const list=snap.docs.map(d=>({id:d.id,...d.data()}));
        setClasses(list);
        if(list.length && !selectedClass) setSelectedClass(list[0]);
      });
    return unsub;
  },[user]);

  /* Load assignments for selected class */
  useEffect(()=>{
    if(!user||!selectedClass) return;
    setAssignments([]); setSelectedAssignment(null);
    const unsub=window._fb.db.collection('users').doc(user.uid)
      .collection('classes').doc(selectedClass.id)
      .collection('assignments')
      .orderBy('createdAt','desc')
      .onSnapshot(snap=>{
        const list=snap.docs.map(d=>({id:d.id,...d.data()}));
        setAssignments(list);
        if(list.length) setSelectedAssignment(list[0]);
      });
    return unsub;
  },[user,selectedClass?.id]);

  /* Load students */
  useEffect(()=>{
    if(!user||!selectedClass) return;
    const unsub=window._fb.db.collection('users').doc(user.uid)
      .collection('classes').doc(selectedClass.id)
      .collection('students')
      .orderBy('order','asc')
      .onSnapshot(snap=>{ setStudents(snap.docs.map(d=>({id:d.id,...d.data()}))); });
    return unsub;
  },[user,selectedClass?.id]);

  /* Load records for selected assignment */
  useEffect(()=>{
    if(!user||!selectedClass||!selectedAssignment) return;
    setRecords({});
    const unsub=window._fb.db.collection('users').doc(user.uid)
      .collection('classes').doc(selectedClass.id)
      .collection('assignments').doc(selectedAssignment.id)
      .collection('records')
      .onSnapshot(snap=>{
        const map={};
        snap.docs.forEach(d=>{ map[d.id]=d.data(); });
        setRecords(map);
      });
    return unsub;
  },[user,selectedClass?.id,selectedAssignment?.id]);

  /* ── Actions ── */
  async function createClass(data){
    setModal(null);
    const ref=window._fb.db.collection('users').doc(user.uid).collection('classes');
    const doc=await ref.add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    setSelectedClass({id:doc.id,...data});
    showToast('สร้างชั้นเรียน '+data.name+' แล้ว');
  }

  async function updateClass(data){
    setModal(null);
    await window._fb.db.collection('users').doc(user.uid).collection('classes').doc(selectedClass.id).update(data);
    setSelectedClass(c=>({...c,...data}));
    showToast('อัปเดตข้อมูลชั้นเรียนแล้ว');
  }

  async function deleteClass(){
    setModal(null);
    await window._fb.db.collection('users').doc(user.uid).collection('classes').doc(selectedClass.id).delete();
    setSelectedClass(null);
    showToast('ลบชั้นเรียนแล้ว');
  }

  async function addStudents(list){
    setModal(null);
    const base=window._fb.db.collection('users').doc(user.uid).collection('classes').doc(selectedClass.id).collection('students');
    const batch=window._fb.db.batch();
    list.forEach((s,i)=>{
      const ref=base.doc();
      batch.set(ref,{...s,order:students.length+i,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    await batch.commit();
    showToast(`เพิ่มนักเรียน ${list.length} คนแล้ว`);
  }

  async function deleteStudent(sid){
    await window._fb.db.collection('users').doc(user.uid).collection('classes').doc(selectedClass.id).collection('students').doc(sid).delete();
    showToast('ลบนักเรียนแล้ว');
  }

  async function createAssignment(data){
    setModal(null);
    const ref=window._fb.db.collection('users').doc(user.uid).collection('classes').doc(selectedClass.id).collection('assignments');
    const doc=await ref.add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    setSelectedAssignment({id:doc.id,...data});
    showToast('สร้างงาน "'+data.title+'" แล้ว');
  }

  async function deleteAssignment(){
    setModal(null);
    await window._fb.db.collection('users').doc(user.uid).collection('classes').doc(selectedClass.id).collection('assignments').doc(selectedAssignment.id).delete();
    setSelectedAssignment(null);
    showToast('ลบงานแล้ว');
  }

  async function toggleStatus(studentId,newStatus){
    const path=window._fb.db.collection('users').doc(user.uid)
      .collection('classes').doc(selectedClass.id)
      .collection('assignments').doc(selectedAssignment.id)
      .collection('records').doc(studentId);
    await path.set({status:newStatus},{ merge:true });
  }

  async function setScore(studentId,score){
    const path=window._fb.db.collection('users').doc(user.uid)
      .collection('classes').doc(selectedClass.id)
      .collection('assignments').doc(selectedAssignment.id)
      .collection('records').doc(studentId);
    await path.set({score:score===''?null:Number(score)},{merge:true});
  }

  async function markAll(status){
    const batch=window._fb.db.batch();
    students.forEach(s=>{
      const ref=window._fb.db.collection('users').doc(user.uid)
        .collection('classes').doc(selectedClass.id)
        .collection('assignments').doc(selectedAssignment.id)
        .collection('records').doc(s.id);
      batch.set(ref,{status},{merge:true});
    });
    await batch.commit();
    showToast(`ทำเครื่องหมาย "${STATUS_LABEL[status]}" ทุกคนแล้ว`);
  }

  function signOut(){ window._fb.auth.signOut(); }

  /* ── Render ── */
  if(!authReady) return null;
  if(!user) return <LoginScreen onLogin={()=>{}}/>;

  return(
    <div className="app-wrap">
      {/* Topbar */}
      <div className="topbar">
        <div className="topbar-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
          ClassCheck Pro
        </div>
        <div className="topbar-spacer"/>
        <span style={{fontSize:13,color:'#6b7280',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {user.displayName||user.email}
        </span>
        <button className="btn btn-ghost btn-sm" onClick={signOut}>ออกจากระบบ</button>
      </div>

      <div className="main-body">
        {/* Sidebar */}
        <div className="sidebar">
          <div className="sidebar-section">ชั้นเรียน</div>
          {classes.map(c=>(
            <button key={c.id} className={`sidebar-item${selectedClass?.id===c.id?' active':''}`}
              onClick={()=>setSelectedClass(c)}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
              <span style={{flex:1,textAlign:'left'}}>{c.name}</span>
              {c.subject&&<span className="badge badge-purple" style={{fontSize:10,padding:'2px 6px'}}>{c.subject.slice(0,6)}</span>}
            </button>
          ))}
          <button className="btn btn-ghost sidebar-item sidebar-add" onClick={()=>setModal('newClass')}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            เพิ่มชั้นเรียน
          </button>

          {selectedClass && <>
            <div className="sidebar-section" style={{marginTop:8}}>งาน / กิจกรรม</div>
            {assignments.map(a=>(
              <button key={a.id} className={`sidebar-item${selectedAssignment?.id===a.id?' active':''}`}
                onClick={()=>setSelectedAssignment(a)}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span style={{flex:1,textAlign:'left',fontSize:13}}>{a.title}</span>
              </button>
            ))}
            <button className="btn btn-ghost sidebar-item sidebar-add" onClick={()=>setModal('newAssignment')}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              เพิ่มงาน
            </button>
          </>}
        </div>

        {/* Main content */}
        <div className="main-content">
          {!selectedClass?(
            <div className="empty-state" style={{paddingTop:80}}>
              <div className="empty-icon">📋</div>
              <div className="empty-text">เลือกหรือสร้างชั้นเรียน</div>
              <div className="empty-sub">เพิ่มชั้นเรียนจากแถบเมนูด้านซ้าย</div>
              <button className="btn btn-primary" style={{marginTop:20}} onClick={()=>setModal('newClass')}>+ สร้างชั้นเรียนแรก</button>
            </div>
          ):(
            <div style={{animation:'fadeIn .3s ease'}}>
              {/* Page header */}
              <div className="page-header">
                <div className="page-title">
                  {selectedClass.name}
                  {selectedClass.subject&&<span className="badge badge-purple">{selectedClass.subject}</span>}
                  {selectedAssignment&&<span className="badge badge-gray" style={{fontWeight:500}}>{selectedAssignment.title}</span>}
                </div>
                <div style={{fontSize:13,color:'#6b7280',marginTop:4}}>
                  ปีการศึกษา {selectedClass.year} ภาค {selectedClass.term}
                  {selectedClass.teacher&&` · ครู${selectedClass.teacher}`}
                  {selectedAssignment?.date&&` · ${formatThaiDate(selectedAssignment.date)}`}
                </div>
                <div className="page-actions">
                  <button className="btn btn-ghost btn-sm" onClick={()=>setModal('newStudent')}>+ เพิ่มนักเรียน</button>
                  {selectedAssignment&&<>
                    <button className="btn btn-ghost btn-sm" onClick={()=>markAll('submitted')}>✓ ทำเครื่องหมายทุกคน</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>markAll('none')}>↺ รีเซ็ตทั้งหมด</button>
                    <button className="btn btn-success btn-sm" onClick={()=>exportPDF(selectedClass,selectedAssignment,students,records)}>
                      📄 ส่งออก PDF
                    </button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setModal('editClass')}>⚙ แก้ไขชั้นเรียน</button>
                    <button className="btn btn-ghost btn-sm" style={{color:'#dc2626'}} onClick={()=>setModal('confirmDeleteAssignment')}>🗑 ลบงานนี้</button>
                  </>}
                  {!selectedAssignment&&<button className="btn btn-primary btn-sm" onClick={()=>setModal('newAssignment')}>+ สร้างงานแรก</button>}
                </div>
              </div>

              {/* Assignment tabs */}
              {assignments.length>1&&(
                <div className="tab-bar">
                  {assignments.map(a=>(
                    <button key={a.id} className={`tab-item${selectedAssignment?.id===a.id?' active':''}`}
                      onClick={()=>setSelectedAssignment(a)}>
                      {a.title}
                    </button>
                  ))}
                </div>
              )}

              {selectedAssignment?(
                <CheckTable
                  assignment={selectedAssignment}
                  students={students}
                  records={records}
                  onToggle={toggleStatus}
                  onScore={setScore}
                />
              ):(
                <div className="empty-state card" style={{marginTop:20,padding:'50px 20px'}}>
                  <div className="empty-icon">📝</div>
                  <div className="empty-text">ยังไม่มีงาน</div>
                  <div className="empty-sub">กด "+ เพิ่มงาน" เพื่อสร้างงานหรือกิจกรรมแรก</div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      {/* Modals */}
      {modal==='newClass'&&<ClassModal onSave={createClass} onClose={()=>setModal(null)}/>}
      {modal==='editClass'&&<ClassModal cls={selectedClass} onSave={updateClass} onClose={()=>setModal(null)}/>}
      {modal==='newStudent'&&<StudentModal onSave={addStudents} onClose={()=>setModal(null)}/>}
      {modal==='newAssignment'&&<AssignmentModal onSave={createAssignment} onClose={()=>setModal(null)}/>}
      {modal==='confirmDeleteClass'&&<Confirm msg={`ลบชั้นเรียน "${selectedClass?.name}" และข้อมูลทั้งหมด?`} onOk={deleteClass} onCancel={()=>setModal(null)}/>}
      {modal==='confirmDeleteAssignment'&&<Confirm msg={`ลบงาน "${selectedAssignment?.title}"?`} onOk={deleteAssignment} onCancel={()=>setModal(null)}/>}

      {/* Toast */}
      {toast&&<Toast msg={toast} onDone={()=>setToast('')}/>}
    </div>
  );
}

const rootEl=document.getElementById('root');
const reactRoot=ReactDOM.createRoot(rootEl);
reactRoot.render(<App/>);
</script>
</body>
</html>
